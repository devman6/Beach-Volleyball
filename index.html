
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beach Volleyball — Down for Maintenance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #082f49, #075985 55%, #0e7490);
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 720px);
      padding: 64px 24px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 24px;
      background: rgba(3,30,48,.48);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }

    .icon {
      font-size: 76px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 58px);
      line-height: 1.05;
    }

    p {
      margin: 20px auto 0;
      max-width: 520px;
      color: #dbeafe;
      font-size: 20px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 30px;
      padding: 9px 15px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 999px;
      color: #fef3c7;
      background: rgba(120,53,15,.35);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <main>
    <div class="icon" aria-hidden="true">🏐</div>

    <h1>Beach Volleyball is Down for Maintenance</h1>

    <p>
      We're making some updates.
      Please check back later!
    </p>

    <div class="status">
      Down for Maintenance
    </div>
  </main>
</body>
</html>
